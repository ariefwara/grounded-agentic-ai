title: Retail Store assisted air fryer purchase
story: A shopper cannot inspect the products in person, compares a broad catalog
  using detailed specifications, gains confidence through fit and exchange guidance,
  and places a pickup purchase.
profileId: retail
actionState:
  prefix: ORD
  nextNumber: 1001
questions:
  - Hi.
  - I need an air fryer, but I have no idea which one to get.
  - Usually for four people. I care more about easy cleaning than extra features.
  - Under $100, and I do not have much counter space. What are my best options in Austin?
  - Compare the top three for me, including size, power, cleaning, warranty, and stock.
  - CrispPro sounds reasonable, but I cannot see it in person, so I am still not sure.
  - What if the size does not work in my kitchen or I do not like it after opening it?
  - That makes me more comfortable. I will take the CrispPro from Austin Central.
  - Yes, place the pickup purchase.
