<form class="composer flex w-full items-center gap-2 px-3 py-3" (submit)="$event.preventDefault(); sendMessage(messageInput)">
  <button class="btn btn-ghost btn-circle shrink-0 text-[#54656f]" type="button" aria-label="Emoji">
    <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="9" />
      <path d="M8.5 10h.01" />
      <path d="M15.5 10h.01" />
      <path d="M8 14.2c1 1.3 2.3 1.9 4 1.9s3-.6 4-1.9" />
    </svg>
  </button>

  <input
    #messageInput
    class="input h-11 min-w-0 flex-1 rounded-full border border-[#d1d7db] bg-white px-5 text-base text-[#111b21] shadow-sm placeholder:text-[#8696a0] focus:border-primary focus:outline-none"
    type="text"
    autocomplete="off"
    placeholder="Type a message"
    (input)="typing.emit()"
  />

  <button class="btn btn-circle shrink-0 border-0 bg-primary text-white hover:bg-secondary" type="submit" aria-label="Send message">
    <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
      <path d="M3 20.5 21 12 3 3.5v6.6l10.6 1.9L3 13.9v6.6Z" />
    </svg>
  </button>
</form>
