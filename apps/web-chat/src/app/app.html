<main class="chat-shell" data-theme="chat">
  <section class="chat-layout">
    <app-chat-header [profile]="profile" />
    <app-message-list [messages]="messages()" />
    <app-chat-composer
      [placeholder]="profile.inputPlaceholder"
      (messageSent)="sendMessage($event.body, $event.requestId)"
      (typing)="playTypingSound()"
    />
  </section>
</main>
