<header class="chat-header flex h-16 shrink-0 items-center gap-3 px-4 text-white">
  <div class="avatar placeholder">
    <div class="profile-avatar h-10 w-10 rounded-full">
      @if (profile().avatarImage) {
        <img [src]="profile().avatarImage" [alt]="profile().assistantName" />
      } @else {
        <span class="text-sm font-semibold">{{ profile().initials }}</span>
      }
    </div>
  </div>

  <div class="min-w-0 flex-1">
    <h1 class="truncate text-base font-semibold leading-5">{{ profile().assistantName }}</h1>
    <p class="truncate text-xs text-white/75">{{ profile().status }}</p>
  </div>

  <button class="btn btn-ghost btn-circle btn-sm text-white" type="button" aria-label="Search">
    <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
  </button>
  <button class="btn btn-ghost btn-circle btn-sm text-white" type="button" aria-label="Menu">
    <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
      <circle cx="12" cy="5" r="1.8" />
      <circle cx="12" cy="12" r="1.8" />
      <circle cx="12" cy="19" r="1.8" />
    </svg>
  </button>
</header>
