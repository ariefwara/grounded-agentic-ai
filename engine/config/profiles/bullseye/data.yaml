adapter: firestore
connection: { projectIdEnv: FIRESTORE_PROJECT_ID, databaseIdEnv: FIRESTORE_DATABASE_ID }
namespace: { collection: simulationDatabases, documentIdEnv: FIRESTORE_SIMULATION_ID }
collections: { customers: customers, policies: policies, documents: documents, records: records, requirements: requirementSchemas, state: state, actions: actionRecords }
preload: [policies, documents, records, requirements]
queryCollections: [documents, policies, records]
searchFields: [id, topic, title, brand, excerpt, text, summary, store, basketMaterial, dimensionsInches]
customerSearchFields: []
actionStorage: { counterDocument: actionCounter }
